name: qemu-verification

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch
        required: true
        default: master
      head_sha:
        description: Commit or PR head SHA to verify
        required: true
      max_profiles:
        description: Maximum QEMU profiles
        required: false
        default: "2"
      only:
        description: Optional comma-separated QEMU suites
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: qemu-verification-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  qemu:
    runs-on: [self-hosted, linux, thingino-qemu]
    timeout-minutes: 240
    env:
      TOOL: tools/thingino-arch
      BASE_REF: ${{ inputs.base_ref }}
      HEAD_SHA: ${{ inputs.head_sha }}
      MAX_PROFILES: ${{ inputs.max_profiles }}
      ONLY_SUITES: ${{ inputs.only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build QEMU plan
        id: plan
        run: |
          set -euo pipefail
          args=(verify --repo . --from "origin/$BASE_REF" --to "$HEAD_SHA" --max-profiles "$MAX_PROFILES" --format shell)
          if [ -n "${ONLY_SUITES:-}" ]; then
            args+=(--only "$ONLY_SUITES")
          fi
          "$TOOL/bin/thingino-arch" "${args[@]}" > qemu-plan.sh
          if grep -q "No QEMU verification plan" qemu-plan.sh; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          cat qemu-plan.sh

      - name: Run QEMU verification
        if: steps.plan.outputs.skip != 'true'
        run: bash qemu-plan.sh

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### QEMU verification"
            echo
            if [ -f qemu-plan.sh ]; then
              echo '```sh'
              sed -n '1,120p' qemu-plan.sh
              echo '```'
            else
              echo "No QEMU plan was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QEMU reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-verification-${{ github.run_attempt }}
          path: |
            qemu-plan.sh
            qemu-reports/
          if-no-files-found: warn
